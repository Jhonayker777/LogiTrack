<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogiTrack · Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand"><i class="bi bi-box-seam"></i> LogiTrack</div>
    <p class="muted">Inventario y auditoría de bodegas</p>

    <form id="loginForm" novalidate>
      <label for="username">Usuario</label>
      <input id="username" name="username" autocomplete="username" required autofocus>

      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <!-- Mensaje de error del login (rojo, debajo del formulario) -->
      <p id="loginError" class="form-error" role="alert" hidden></p>

      <button class="btn btn-success btn-block" id="loginBtn" type="submit">Iniciar sesión</button>
    </form>
  </main>
  <div id="toasts" class="toasts"></div>
  <script src="js/auth.js"></script>
  <script>initLoginPage();</script>
</body>
</html>
