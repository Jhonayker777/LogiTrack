<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LogiTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
    <div class="brand"><i class="bi bi-box-seam"></i> LogiTrack</div>
    <div class="topbar-right">
      <span class="user-chip"><i class="bi bi-person-circle"></i> <span id="userInfo"></span></span>
      <button class="btn btn-ghost" id="logoutTop"><i class="bi bi-box-arrow-right"></i> Cerrar sesión</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar">
      <a href="#" data-view="productos"><i class="bi bi-boxes"></i> Productos</a>
      <a href="#" data-view="movimientos"><i class="bi bi-arrow-left-right"></i> Movimientos</a>
      <a href="#" data-view="auditoria" id="navAudit"><i class="bi bi-clipboard-data"></i> Auditoría</a>
      <a href="#" id="logoutSide"><i class="bi bi-box-arrow-left"></i> Cerrar sesión</a>
    </nav>
    <!-- Aquí app.js carga dinámicamente cada sección -->
    <main class="content" id="content"></main>
  </div>

  <div id="modalRoot"></div>
  <div id="toasts" class="toasts"></div>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
