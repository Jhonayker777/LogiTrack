<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e13"><title>LogiTrack · Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script src="https://unpkg.com/lucide@latest"></script></head>
<body class="app-body"><div class="app-shell">
<aside class="sidebar" id="sidebar"><div class="sidebar-top"><a class="brand" href="#dashboard"><span class="brand-mark"><i data-lucide="boxes"></i></span><span>LogiTrack<span class="brand-dot">.</span></span></a><button class="icon-button sidebar-close" id="sidebarClose"><i data-lucide="x"></i></button></div>
<div class="workspace-switch"><span class="workspace-avatar">LT</span><span><b>Centro logístico</b><small>Workspace principal</small></span><i data-lucide="chevrons-up-down"></i></div>
<nav class="nav-scroll"><div class="nav-group"><span class="nav-label">GENERAL</span><button class="nav-link" data-view="perfil"><i data-lucide="user-round"></i>Mi perfil</button><button class="nav-link active" data-view="dashboard"><i data-lucide="layout-dashboard"></i>Resumen</button></div>
<div class="nav-group"><span class="nav-label">INVENTARIO</span><button class="nav-link" data-view="productos"><i data-lucide="package"></i>Productos</button><button class="nav-link" data-view="stock"><i data-lucide="boxes"></i>Stock por bodega</button><button class="nav-link" data-view="movimientos"><i data-lucide="arrow-left-right"></i>Movimientos</button><button class="nav-link" data-view="detalles"><i data-lucide="list-tree"></i>Detalle movimientos</button><button class="nav-link" data-view="bodegas"><i data-lucide="warehouse"></i>Bodegas</button></div>
<div class="nav-group"><span class="nav-label">ADMINISTRACIÓN</span><button class="nav-link admin-only" data-view="usuarios"><i data-lucide="users"></i>Usuarios</button><button class="nav-link admin-only" data-view="solicitudes"><i data-lucide="user-check"></i>Solicitudes</button><button class="nav-link admin-only" data-view="auditoria"><i data-lucide="scan-search"></i>Auditoría</button></div>
<div class="nav-group"><span class="nav-label">UBICACIONES</span><button class="nav-link" data-view="departamentos"><i data-lucide="map"></i>Departamentos</button><button class="nav-link" data-view="ciudades"><i data-lucide="map-pin"></i>Ciudades</button></div></nav>
<div class="sidebar-bottom"><div class="system-status"><span class="status-pulse"></span><span><b>API conectada</b><small id="apiStatus">Comprobando conexión…</small></span></div><button class="nav-link" id="logoutButton"><i data-lucide="log-out"></i>Cerrar sesión</button></div></aside>
<div class="sidebar-scrim" id="sidebarScrim"></div>
<main class="main-area"><header class="topbar"><div class="topbar-left"><button class="icon-button mobile-menu" id="menuToggle"><i data-lucide="menu"></i></button><div class="breadcrumbs"><span>Workspace</span><i data-lucide="chevron-right"></i><b id="breadcrumbCurrent">Resumen</b></div></div><div class="topbar-right"><span class="top-date" id="currentDate"></span><div class="top-divider"></div><div class="user-menu"><span class="user-avatar" id="userAvatar">LT</span><span class="user-meta"><b id="headerUsername">Usuario</b><small id="headerRole">ROL</small></span></div></div></header>
<section class="page-content" id="pageContent"><div class="loading-state"><span class="spinner"></span><p>Cargando espacio de trabajo…</p></div></section>
<footer class="app-footer"><span>LogiTrack <b>·</b> Gestión inteligente de inventarios</span><span id="footerVersion">API REST · JWT</span></footer></main></div>
<div id="modalRoot"></div><div id="toastRegion" class="toast-region" aria-live="polite"></div><script type="module" src="app.js"></script></body></html>
