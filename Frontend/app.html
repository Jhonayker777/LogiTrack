<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1b2d">
  <meta name="description" content="LogiTrack - Panel de gestión de inventario y bodegas">
  <title>Panel | LogiTrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <a href="#main" class="skip-link">Saltar al contenido</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegación principal">
      <div class="brand brand-light">
        <span class="brand-mark" id="brand-mark"></span>
        <span class="brand-name">LogiTrack</span>
      </div>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <div class="user-chip">
          <span class="avatar" id="user-avatar"></span>
          <div class="user-meta">
            <span class="user-name" id="user-name"></span>
            <span class="user-role" id="user-role"></span>
          </div>
        </div>
        <button type="button" class="btn btn-sidebar" id="logout-btn"></button>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="main-col">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu-btn" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false"></button>
        <div class="topbar-titles">
          <h1 id="page-title">Panel</h1>
          <p id="page-subtitle" class="muted-text"></p>
        </div>
        <div class="topbar-actions" id="page-actions"></div>
      </header>
      <main id="main" class="content" tabindex="-1"></main>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/ui.js"></script>
  <script src="./js/resources.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
